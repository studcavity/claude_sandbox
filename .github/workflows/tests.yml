name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token. `pull_request` withholds secrets from *fork* PRs only: a PR
# from a branch in this repo (every sandbox session's PR) runs the branch's
# own workflow code WITH repo Actions secrets. This workflow uses none; keep
# it that way, and put real secrets in an Environment limited to the default
# branch. The launcher never opens a PR that edits .github/.
permissions:
  contents: read

# GitHub's default for `run:` is `bash -e {0}`: no pipefail, so
# `pytest | tee out` "passes" even when pytest fails. Every step here runs
# strict instead. tests/test_ci_config.py keeps this in place.
defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pushes to main always run. PRs run only when the head branch lives in
    # this repository (same-owner PRs); PRs from forks are skipped.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check claude_sandbox scripts tests
      - name: Types (mypy)
        run: python -m mypy claude_sandbox scripts/*.py
      - name: Lint (shellcheck)
        run: shellcheck run.sh scripts/*.sh .githooks/*
      - name: Run tests
        run: |
          set +e
          python -m pytest -n auto -rs -rf 2>&1 | tee pytest.out
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # Surface failures as annotations: visible in the checks UI and
            # readable through the public API without a token.
            grep -E '^(FAILED|ERROR) ' pytest.out | head -20 | sed 's/^/::error::/'
          fi
          exit "$rc"

  # Real-container tests (tests/integration). GitHub's ubuntu runners are VMs,
  # so incus runs natively here; no nesting needed. Same trigger rules as above.
  integration:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install incus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq incus
          sudo incus admin init --minimal
          # The runner is throwaway: let this user talk to the daemon.
          sudo chmod 0666 /var/lib/incus/unix.socket
          # Docker's firewall rules otherwise block incus's bridge traffic.
          sudo iptables -I DOCKER-USER -j ACCEPT || true
          sudo ip6tables -I DOCKER-USER -j ACCEPT || true
          incus version
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run integration tests (must not be skipped)
        env:
          CS_INTEGRATION: "1"
          # Real read-only GitHub calls through the runner's preinstalled gh.
          CS_GH_LIVE: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pytest -m "(incus or gh) and not smoke" tests/integration -rs | tee pytest.out
          if grep -q SKIPPED pytest.out; then
            echo "integration tests were skipped" >&2
            exit 1
          fi
      # A real container driven through the launcher's own lifecycle methods
      # (launch, key, clone, CLAUDE.md, session, teardown) with only GitHub
      # faked. Catches bugs that live between the pieces, in a real container.
      - name: Smoke - real launch lifecycle (must not be skipped)
        env:
          CS_INTEGRATION: "1"
        run: |
          python -m pytest -m smoke tests/integration/test_launch.py -rs | tee pytest.out
          if grep -q SKIPPED pytest.out; then
            echo "smoke test was skipped" >&2
            exit 1
          fi
