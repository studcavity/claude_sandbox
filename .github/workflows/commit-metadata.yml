name: commit-metadata

# Lints the work record of every commit a PR adds (see sandbox_check.py):
# conventional subjects, no merge or fixup commits, a Verified / Not verified
# line where a change needs a real run, no credential-shaped text, and the
# format of any todo/<name>.md follow-up request (portable/todo.py). This job is
# the one merge gate for the checker.
on:
  pull_request:
    branches: [main]

# Read-only, no secrets.
permissions:
  contents: read

# Strict shell, as in tests.yml (GitHub's default has no pipefail).
defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: commit-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is the status check's name. It is what the ruleset requires;
  # renaming it strands every open PR, so change both together.
  commit-metadata:
    # Runs on fork PRs too. A job skipped by a job-level `if` reports as
    # passing to a required check, so skipping forks would wave them
    # through. Running is safe: the checker comes from the base, the PR's
    # commits are only data, and fork PRs get a read-only token, no secrets.
    runs-on: ubuntu-latest
    steps:
      # The checker comes from the PR's BASE (main), never from the PR: a
      # branch can't weaken the rules it is judged by. Its own commits are
      # only data, checked out (with history) next to it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check commit metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The checker is stdlib-only: nothing to install. There is no
        # fallback to the PR's own copy; if main has no checker, this fails.
        # -E -s: ignore PYTHON* env vars and the user site directory.
        run: |
          cd pr
          python -E -s ../trusted/scripts/sandbox_check.py "$BASE_SHA" "$HEAD_SHA"
