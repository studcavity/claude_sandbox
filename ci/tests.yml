name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token; `pull_request` (not `pull_request_target`) never exposes
# secrets to PR code.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pushes to main always run. PRs run only when the head branch lives in
    # this repository (same-owner PRs); PRs from forks are skipped.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (pyflakes)
        run: python -m pyflakes *.py tests/
      - name: Lint (shellcheck)
        run: shellcheck run.sh
      - name: Run tests
        run: python -m pytest -rs
