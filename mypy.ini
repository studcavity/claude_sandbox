[mypy]
# check_untyped_defs is the point: most of this code is unannotated, and mypy
# skips the bodies of unannotated functions by default. With it on, mypy
# reports `Cannot assign to a method` for an instance attribute that shadows a
# method (the bug that crashed every launch). tests/test_ci_config.py proves
# the setting still catches that, so it can't be dropped quietly.
check_untyped_defs = True
ignore_missing_imports = True
warn_unused_ignores = True
