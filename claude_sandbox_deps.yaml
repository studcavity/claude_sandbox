# Tooling installed into the sandbox before the session starts.
# Format and rules: see "repo dependencies" in README.md. Any invalid entry
# aborts the launch; skip this file with --no-deps.
# Install order: apt, binaries, scripts.

# Where/when this toolchain was resolved, so it can be reproduced later.
# Refresh both whenever you edit this file (inert metadata, never executed).
last_generated: "2026-11-15T01:56:39Z"   # date -u +%Y-%m-%dT%H:%M:%SZ
platform: |                              # lsb_release -a; uname -m
  Distributor ID: Ubuntu
  Description:    Ubuntu 24.04.5 LTS
  Release:        24.04
  Codename:       noble
  x86_64

# Debian/Ubuntu packages (optionally pinned: name=version).
apt:
  - shfmt
  # Nested containers for tests/integration (launch with --nesting; the
  # launcher then fixes subuid/socket and runs `incus admin init --minimal`).
  - incus
  # tests/integration/test_gh.py drives the real gh binary against a local fake
  # API. It is never logged in here, so it cannot call GitHub.
  - gh

# Prebuilt binaries -> /usr/local/bin/<name>. sha256 is required and covers
# the downloaded file (here, the archive); archive_path picks the file inside.
binaries:
  - name: shellcheck
    url: https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
    sha256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
    archive_path: shellcheck-v0.10.0/shellcheck

